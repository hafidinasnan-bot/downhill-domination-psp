
name: Build PSP Prototype

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Compile PSP application
        run: make

      - name: Upload PSP application
        uses: actions/upload-artifact@v4
        with:
          name: downhill-psp
          path: EBOOT.PBP
          
